# Main paper recipe. Unspecified engineering choices are documented in docs/reproduction.md.
data:
  train_files: data/geometry3k/train.parquet
  val_files: data/geometry3k/validation200.parquet
  prompt_key: problem
  answer_key: answer
  image_key: images
  max_prompt_length: 8192
  max_response_length: 4096
  rollout_batch_size: 16
  val_batch_size: 200
  format_prompt: null
  system_prompt: null
  seed: 42
  min_pixels: 262144
  max_pixels: 4194304
  filter_overlong_prompts: false
worker:
  actor:
    global_batch_size: 16
    # Update microbatch is derived as 16 * 4 / DP ranks by va_opd.train (8 on 8 GPUs).
    micro_batch_size_per_device_for_experience: 8
    ppo_epochs: 1
    loss_avg_mode: token
    padding_free: true
    dynamic_batching: false
    ulysses_size: 1
    use_torch_compile: false
    max_grad_norm: 1.0
    model:
      model_path: Qwen/Qwen3-VL-2B-Instruct
      enable_gradient_checkpointing: true
      freeze_vision_tower: false
      plain_think_tokens: false
    optim:
      strategy: adamw
      lr: 1.0e-6
      betas: [0.9, 0.95]
      weight_decay: 0.1
      lr_scheduler_type: cosine
      lr_warmup_ratio: 0.05
    fsdp:
      mp_param_dtype: bf16
      mp_reduce_dtype: fp32
      mp_buffer_dtype: bf16
    offload:
      offload_params: false
      offload_optimizer: false
  teacher:
    source: model
    model:
      model_path: Qwen/Qwen3-VL-8B-Instruct
    fsdp:
      torch_dtype: bf16
      mp_param_dtype: bf16
  rollout:
    n: 4
    temperature: 0.7
    top_p: 0.95
    top_k: -1
    seed: 42
    dtype: bf16
    tensor_parallel_size: 1
    gpu_memory_utilization: 0.5
    enforce_eager: true
    enable_chunked_prefill: false
    max_num_batched_tokens: 16384
    val_override_config:
      n: 8
      temperature: 1.0
      top_p: 1.0
      top_k: -1
  reward:
    reward_function: va_opd/rewards.py:compute_score
algorithm:
  policy_loss_coef: 0.0
  distill_loss_coef: 1.0
  distill_divergence: reverse_kl
  distill_support: full
  distill_target: teacher
  distill_temperature: 1.0
  distill_weighting: va_opd
  distill_is_clip: null
  distill_chunk_size: 128
  disable_kl: true
  use_kl_loss: false
  corrupt_image: pixelation
  corrupt_image_kwargs: {ratio: 0.1}
  visual_sensitivity_reference: teacher
  visual_sensitivity_metric: sampled_positive_log_ratio
  va_opd_softmax_temperature: 1.0
  va_opd_high_fraction: 0.2
  va_opd_high_weight: 0.5
  online_filtering: false
trainer:
  project_name: VA-OPD
  experiment_name: qwen3_vl_2b_va_opd_8b_geo3k
  logger: [console]
  total_epochs: 5
  nnodes: 1
  n_gpus_per_node: 8
  val_freq: 50
  save_freq: 50
  save_limit: -1
  save_model_only: false
  val_before_train: true
  find_last_checkpoint: true
  val_generations_to_log: 0
