[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "va-opd"
version = "0.1.0"
description = "Visual-Advantage On-Policy Distillation for Vision-Language Models"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "VA-OPD authors"}]
dependencies = ["torch>=2.6", "numpy", "pillow>=9.1", "pyyaml", "omegaconf>=2.3", "codetiming"]

[project.optional-dependencies]
data = ["datasets>=3", "pyarrow>=15"]
train = [
  "vllm==0.17.1", "transformers>=4.57,<5", "ray[default]>=2.48",
  "accelerate", "datasets>=3", "pyarrow>=15", "einops", "tensordict",
  "torchdata", "qwen-vl-utils", "peft", "liger-kernel", "mathruler",
  "math-verify[antlr4_9_3]", "pylatexenc", "pandas", "scipy", "requests",
  "flask", "timm", "wandb", "swanlab", "nltk==3.9.4"
]
dev = ["pytest>=8", "ruff>=0.9"]

[project.urls]
Homepage = "https://github.com/handsome-rich/VA-OPD"
Paper = "https://arxiv.org/abs/2605.21924"

[tool.setuptools.packages.find]
include = ["va_opd*", "verl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 119

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

