name: CPU correctness
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e '.[data,dev]'
      - run: pytest -q
      - run: ruff check va_opd tests verl/trainer/distillation.py
      - run: python -m va_opd.train --dry-run
      - run: python -m va_opd.train --method opd --dry-run
      - run: bash -n scripts/train.sh
